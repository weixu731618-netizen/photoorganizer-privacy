<title>PhotoOrganizer Privacy Policy</title>
<script>
  // 按浏览器语言跳转：中文去简体版，其他去英文版。
  var zh = (navigator.language || "").toLowerCase().indexOf("zh") === 0;
  location.replace(zh ? "zh-Hans/" : "en/");
</script>
<noscript>
  <p><a href="en/">English</a> · <a href="zh-Hans/">简体中文</a></p>
</noscript>
